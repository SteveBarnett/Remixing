<script>
(() => {
  const showhideJp = document.getElementById("show-hide-jp");

  const buttons = [
    { label: "Toggle English", cls: "hide-en" },
    { label: "Toggle Kanji/Kana", cls: "hide-ka" },
    { label: "Toggle Rōmaji", cls: "hide-ro" },
  ];

  buttons.forEach(({ label, cls }) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = label;
    btn.setAttribute("aria-pressed", "false");

    btn.addEventListener("click", () => {
      const isHidden = document.body.classList.toggle(cls);
      btn.setAttribute("aria-pressed", String(isHidden));
    });
    showhideJp.appendChild(btn);
  });
})();
</script>
